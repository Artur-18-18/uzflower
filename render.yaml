services:
  - type: web
    name: uzflower
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Явный публичный URL (альтернатива: Render подставляет RENDER_EXTERNAL_URL автоматически)
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./uzflower.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_TELEGRAM_BOTS
        value: true
      - key: BOT_MODE
        value: webhook
      # Внутренние вызовы API ботами; на Render оставьте localhost (тот же процесс)
      - key: TELEGRAM_API_URL
        value: http://127.0.0.1:8000
      - key: TELEGRAM_API_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    disk:
      name: uzflower-data
      mountPath: /app
      sizeGB: 1
